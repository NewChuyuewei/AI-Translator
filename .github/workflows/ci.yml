name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend and Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libfontconfig1-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:version
      - run: npm run test:android-config
      - run: npm run test:assurance
      - name: TEMP generate native Rust lockfile
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v6
        with:
          name: generated-lockfile
          path: Cargo.lock
      - name: Verify native Rust lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Verify native Rust formatting
        run: |
          if cargo fmt --all --check >rustfmt.log 2>&1; then exit 0; fi
          cat rustfmt.log
          details="$(tail -c 12000 rustfmt.log)"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Rust formatting failed::${details}"
          exit 1
      - name: Verify native Rust static analysis
        run: |
          if cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings >clippy.log 2>&1; then exit 0; fi
          cat clippy.log
          details="$(tail -c 12000 clippy.log | sed -r 's/\x1B\[[0-9;]*[mK]//g')"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Rust Clippy failed::${details}"
          exit 1
      - name: Cross-check native window and lifecycle adapters
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
          cargo check --locked -p caption-platform -p desktop-lifecycle --target x86_64-pc-windows-gnu
          cargo check --locked -p caption-platform -p desktop-lifecycle --target x86_64-apple-darwin
      - name: Test Rust workspace and compile Slint desktop
        run: |
          if cargo test --workspace --all-targets --locked >workspace-test.log 2>&1; then
            cat workspace-test.log
          else
            cat workspace-test.log
            details="$(grep -E -i -B 3 -A 12 'error\[|error:|failed|panicked' workspace-test.log | tail -c 12000)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Rust workspace tests failed::${details}"
            exit 1
          fi
      - name: Run legacy Tauri adapter tests
        run: |
          if cargo test --manifest-path src-tauri/Cargo.toml --lib --locked >rust-test.log 2>&1; then
            cat rust-test.log
          else
            cat rust-test.log
            details="$(grep -E -i -B 3 -A 10 'error\[|error:|failed|panicked' rust-test.log | tail -c 12000)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Rust tests failed::${details}"
            exit 1
          fi

  android-native:
    name: Native Android Kotlin + JDK 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.9.1
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and build native Android app
        run: |
          if gradle -p android --no-daemon testDebugUnitTest assembleDebug >android-native.log 2>&1; then
            cat android-native.log
          else
            tail -n 240 android-native.log
            details="$(grep -E -i -B 4 -A 12 'FAILURE:|What went wrong:|^e: |error:|exception|could not|failed' android-native.log | tail -c 12000)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Native Android build failed::${details}"
            exit 1
          fi
      - name: Verify Kotlin and Java 25 bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/build")
          for filename in ("MainActivity.class", "SessionConfig.class"):
              matches = list(root.rglob(filename))
              if not matches:
                  raise SystemExit(f"Missing compiled class: {filename}")
              versions = {int.from_bytes(path.read_bytes()[6:8], "big") for path in matches}
              if versions != {69}:
                  raise SystemExit(f"{filename}: expected Java 25 class version 69, got {sorted(versions)}")
              print(f"Verified {filename}: Java 25 class version 69")
          PY
