name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Custom release tag (vMAJOR.MINOR.PATCH), for example v0.2.1
        required: true
        type: string
      release_mode:
        description: Choose whether to keep artifacts only, publish a prerelease, or publish a stable release
        required: true
        default: build_only
        type: choice
        options:
          - build_only
          - prerelease
          - release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            bundles: nsis
            artifact: windows-x64
          # screencapturekit 11 pulls apple-metal 0.10, whose Swift bridge
          # references Metal APIs from the macOS 26 SDK. macos-15 defaults to
          # Xcode 16.4 even though newer Xcodes are installed, so use the
          # Apple Silicon image whose default toolchain is Xcode 26.
          - os: macos-26
            label: macOS Apple Silicon
            bundles: dmg
            artifact: macos-arm64
          - os: ubuntu-24.04
            label: Linux x64
            bundles: deb,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Apply custom release version
        shell: bash
        run: |
          test "${RELEASE_TAG}" = "v${RELEASE_TAG#v}" || { echo "Release tag must start with v"; exit 1; }
          node scripts/set-version.mjs "${RELEASE_TAG#v}"
      - name: Verify macOS 26 SDK toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev pkg-config
      - run: npm ci
      - run: npm run test:ui
      - name: Build native bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $binary = "src-tauri/target/release/gemini-live-translator.exe"
          if (-not (Test-Path $binary)) { throw "Windows application binary was not found: $binary" }

          $portableName = "Gemini-Live-Translator-$version-Windows-portable"
          $portableDir = Join-Path $env:RUNNER_TEMP $portableName
          $archive = "release-assets/$portableName.zip"
          New-Item -ItemType Directory -Force -Path $portableDir, "release-assets" | Out-Null
          Copy-Item $binary (Join-Path $portableDir "Gemini-Live-Translator.exe")
          $readme = Get-Content "packaging/windows-portable-readme.txt" -Raw
          $readme = $readme -replace '(?m)^Gemini Live Translator [^ ]+', "Gemini Live Translator $version"
          Set-Content (Join-Path $portableDir "README.txt") -Value $readme -Encoding utf8
          Copy-Item "COPYRIGHT" (Join-Path $portableDir "COPYRIGHT.txt")

          # MSVC normally links the WebView2 loader statically. Preserve a DLL
          # beside the executable if a future Tauri build emits one dynamically.
          $loader = Get-ChildItem "src-tauri/target/release" -Recurse -Filter "WebView2Loader.dll" |
            Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName $portableDir }

          Compress-Archive -Path "$portableDir/*" -DestinationPath $archive -CompressionLevel Optimal
          Write-Host "Created $archive"
      - name: Stage native bundles
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp '{}' release-assets/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Native Android Kotlin debug APK
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.9.1
      - name: Apply custom release version
        run: |
          test "${RELEASE_TAG}" = "v${RELEASE_TAG#v}" || { echo "Release tag must start with v"; exit 1; }
          node scripts/set-version.mjs "${RELEASE_TAG#v}"
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and build native Android APK
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug
      - name: Verify Java 25 Kotlin bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ("MainActivity.class", "SessionConfig.class"):
              matches = list(Path("android/app/build").rglob(filename))
              if not matches:
                  raise SystemExit(f"Missing compiled class: {filename}")
              versions = {int.from_bytes(path.read_bytes()[6:8], "big") for path in matches}
              if versions != {69}:
                  raise SystemExit(f"{filename}: expected Java 25 class version 69, got {sorted(versions)}")
          PY
      - name: Stage APK
        run: |
          mkdir -p release-assets
          VERSION="${RELEASE_TAG#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/Gemini-Live-Translator-${VERSION}-native-android-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-debug
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' || inputs.release_mode != 'build_only'
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'release' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate and apply custom release version
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/set-version.mjs "$VERSION"
          test "${RELEASE_TAG}" = "v${VERSION}" || { echo "Release tag must use vMAJOR.MINOR.PATCH"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          sha256sum * > SHA256SUMS.txt
      - name: Create or update release
        shell: bash
        run: |
          flags=(--title "Gemini Live Translator ${RELEASE_TAG}" --generate-notes --target "${GITHUB_SHA}")
          prerelease=false
          if [[ "${RELEASE_MODE}" == "prerelease" ]]; then flags+=(--prerelease); prerelease=true; fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "Gemini Live Translator ${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" --prerelease="${prerelease}"
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* "${flags[@]}"
          fi
