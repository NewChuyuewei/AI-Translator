[package]
name = "translator-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../COPYRIGHT"
repository.workspace = true
description = "Native Slint desktop shell for Gemini Live Translator"
build = "build.rs"

[[bin]]
name = "gemini-live-translator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
caption-platform = { path = "../crates/caption-platform" }
cpal.workspace = true
desktop-lifecycle = { path = "../crates/desktop-lifecycle" }
futures-util.workspace = true
proxyres.workspace = true
rustls.workspace = true
slint.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
translator-core = { path = "../crates/translator-core" }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-core-audio-types = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMBlockBuffer", "CMSync", "objc2-core-audio-types"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent"] }

[build-dependencies]
slint-build = "1.18.1"
