[workspace]
resolver = "2"
members = [
  "crates/translator-core",
  "desktop-slint",
]
exclude = ["src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["chuyuewei"]
license-file = "COPYRIGHT"
repository = "https://github.com/NewChuyuewei/AI-Translator"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
cpal = "0.15.3"
percent-encoding = "2.3.2"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
zeroize = "1.9.1"
slint = "1.18.1"
