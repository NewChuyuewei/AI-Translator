[workspace]
resolver = "2"
members = [
  "crates/caption-platform",
  "crates/desktop-lifecycle",
  "crates/macos-system-audio",
  "crates/translator-core",
  "desktop-slint",
]
exclude = ["src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["chuyuewei"]
license-file = "COPYRIGHT"
repository = "https://github.com/NewChuyuewei/AI-Translator"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
cpal = "0.15.3"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
proxyres = "=1.5.7"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
zeroize = "1.9.1"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
