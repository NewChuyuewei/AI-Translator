[package]
name = "tauri-plugin-mobile-audio"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-mobile-audio"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossbeam-channel = "0.5.17"
jni = "0.21.1"
